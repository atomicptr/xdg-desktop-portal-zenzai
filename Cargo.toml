[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/atomicptr/xdg-desktop-portal-zenzai"

[workspace.dependencies]
zenzai-core = { path = "crates/zenzai-core", version = "0.7.2" }
anyhow = "1.0.105"
csscolorparser = { version = "0.9.2", features = ["serde"] }
dirs = "7.0.0"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "image-without-codecs", "tokio", "crisp", "advanced"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"

# PDF rendering and the UI are unusably slow unoptimized, keep dependencies fast in dev builds
[profile.dev.package."*"]
opt-level = 3
