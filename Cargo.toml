[package]
name = "xdg-desktop-portal-zenzai"
description = "A collection of several xdg-desktop-portal implementations to serve more lightweight wayland compositors like Hyprland"
version = "0.3.6"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
csscolorparser = "0.9.2"
rand = "0.10.4"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"
zbus = { version = "6.5.0", features = ["tokio"] }
