[package]
name = "xdg-desktop-portal-zenzai"
description = "A collection of several xdg-desktop-portal implementations to serve more lightweight wayland compositors like Hyprland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
notify = "8.2.0"
rand = "0.10.4"
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.9"
which.workspace = true
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
zenzai-core = { workspace = true, features = ["i18n"] }

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
