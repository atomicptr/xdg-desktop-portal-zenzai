[package]
name = "zenzai-app-select"
description = "A compact application chooser for lightweight Wayland compositors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.9", features = ["derive"] }
dirs.workspace = true
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }
freedesktop-icons = "0.4.0"
iced = { workspace = true, features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
termlauncher = "0.4.0"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.9"
which.workspace = true
zenzai-core = { workspace = true, features = ["ui"] }
