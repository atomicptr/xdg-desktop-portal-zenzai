[package]
name = "zenzai-dialog-print"
description = "A minimal print dialog for lightweight wayland compositors, part of xdg-desktop-portal-zenzai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
ashpd = { version = "0.14.3", default-features = false, features = ["file_chooser", "tokio"] }
clap = { version = "4.6.9", features = ["derive"] }
cups_rs = "0.3.0"
dirs.workspace = true
hayro = "0.9.0"
iced.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.9"
zenzai-core = { workspace = true, features = ["ui"] }

[lints]
workspace = true
